[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dns-probe"
version = "1.2.0"
description = "DNS Probe: fast, bounded DNS diagnostics with readable answers and JSON evidence"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["dns", "cli", "diagnostics", "network", "json", "dnssec"]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Programming Language :: Python :: 3", "Topic :: Internet :: Name Service (DNS)"]
dependencies = ["dnspython[doh,dnssec,doq]==2.8.0", "jsonschema>=4.23,<5", "psutil>=7,<8"]

[project.urls]
Repository = "https://github.com/VincentJiang06/dns-probe"
Issues = "https://github.com/VincentJiang06/dns-probe/issues"
Changelog = "https://github.com/VincentJiang06/dns-probe/blob/main/CHANGELOG.md"

[project.scripts]
dnsprobe = "dnsprobe.cli:main"
dnstk = "dnsprobe.legacy:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dnsprobe"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/LEGACY_MIGRATION.md", "/pyproject.toml", "/uv.lock", "/dnstk.py", "/dns_core.py", "/dns_bench.py", "/dns_bench_hk.py", "/dns_lab.py", "/.github", "/README.zh-CN.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/scripts", "/Dockerfile", "/.dockerignore", "/LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "build>=1", "hatchling>=1.27"]
