name: Feature request
description: Describe a diagnostic or agent integration use case.
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case and expected result
      description: What decision should the CLI help a person or agent make?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Suggested command or JSON contract
      description: Include time budget, prerequisites and how incomplete results should behave.
