name: Bug report
description: Reproduce a CLI, protocol, or reporting problem with synthetic inputs.
title: "[bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include dnsprobe --version, operating system, Python version and install method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal command or JSON request
      description: Replace private names, addresses, tokens and local paths with synthetic values.
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include exit code and a sanitized summary. Do not upload full network configurations.
    validations:
      required: true
