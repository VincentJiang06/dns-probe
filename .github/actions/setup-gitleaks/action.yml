name: Install verified Gitleaks
description: Install a pinned Linux scanner and verify its SHA-256 before execution.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLEAKS_VERSION: '8.30.1'
        GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        install_dir="$RUNNER_TEMP/gitleaks-bin"
        curl --fail --silent --show-error --location \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
        mkdir -p "$install_dir"
        tar -xzf "$archive" -C "$install_dir" gitleaks
        printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
